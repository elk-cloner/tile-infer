name: Build image

# Builds TileGym's own Dockerfile from the current main branch of NVIDIA/TileGym.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out TileGym main
        uses: actions/checkout@v7
        with:
          repository: NVIDIA/TileGym
          ref: main
          persist-credentials: false

      - name: Set image name and tags
        id: vars
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          commit="$(git rev-parse HEAD)"
          {
            echo "image=${image}"
            echo "commit=${commit}"
            echo "short=${commit:0:12}"
          } >> "$GITHUB_OUTPUT"

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: modeling/transformers/Dockerfile
          target: source
          push: true
          provenance: false
          tags: |
            ${{ steps.vars.outputs.image }}:main
            ${{ steps.vars.outputs.image }}:main-${{ steps.vars.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=TileGym development image
            tilegym.commit=${{ steps.vars.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write summary
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          SHORT: ${{ steps.vars.outputs.short }}
          COMMIT: ${{ steps.vars.outputs.commit }}
        run: |
          {
            echo "Built from [NVIDIA/TileGym@${SHORT}](https://github.com/NVIDIA/TileGym/commit/${COMMIT})."
            echo
            echo '```'
            echo "docker pull ${IMAGE}:main-${SHORT}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
